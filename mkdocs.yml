# The documentation site (docs/), built by CI and published to GitLab Pages from main.
# Locally:  pip install -r docs/requirements.txt && mkdocs serve
site_name: PeckList
site_description: Self-hosted, offline-first tasks and calendar
site_url: https://docs.pecklist.com/
repo_url: https://gitlab.com/killswitch10/pecklist
repo_name: killswitch10/pecklist
edit_uri: -/edit/main/docs/
docs_dir: docs
strict: true
# Broken links and #anchors fail the build (strict turns warnings into errors).
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  custom_dir: docs-theme
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  # `--8<-- "examples/..."` pulls an example file into a page, so docs and examples never drift.
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

nav:
  - Home: index.md
  - Getting started:
      - Quick start: getting-started/quick-start.md
      - First start: getting-started/first-start.md
  - Install:
      - Docker: install/docker.md
      - Docker Compose: install/docker-compose.md
      - Linux: install/linux.md
      - Windows: install/windows.md
      - From source: install/from-source.md
      - Reverse proxy and HTTPS: install/reverse-proxy.md
      - Demo server: install/demo.md
  - Configuration:
      - How settings work: configuration/index.md
      - All settings: configuration/reference.md
      - Settings file: configuration/config-file.md
      - Database: configuration/database.md
  - Guides:
      - Users, roles and groups: guides/users-and-roles.md
      - Single sign-on (OIDC): guides/single-sign-on.md
      - Email: guides/email.md
      - Mutual TLS (client certificates): guides/mutual-tls.md
      - Backups and restore: guides/backups.md
      - Logs and audit: guides/logging.md
      - Monitoring and stats: guides/monitoring.md
      - Upgrading: guides/upgrading.md
      - Security: guides/security.md
      - Troubleshooting: guides/troubleshooting.md
  - Using PeckList:
      - Tour: using/index.md
      - Quick add and shortcuts: using/quick-add-and-shortcuts.md
      - Sharing: using/sharing.md
      - Apps, offline and sync: using/apps-and-sync.md
      - Privacy and telemetry: using/privacy.md
      - Moving from TickTick or Todoist: using/moving-from-ticktick-or-todoist.md
      - The Android app: using/android-app.md
  - About:
      - Why PeckList: about/why.md
      - Compared with others: about/comparison.md
