apply plugin: 'com.android.application'

// Release signing (docs/development/android.md): the key and its password come from the
// environment (CI variables), never the repo. Without ANDROID_KEYSTORE_FILE a release build is
// unsigned.
def releaseKeystore = System.getenv('ANDROID_KEYSTORE_FILE')
def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')

// The version: version.properties, which `pnpm release` writes (scripts/versions.mjs), so a build
// from a release tag needs nothing else: F-Droid builds it that way and must get the same APK as
// ours. CI's builds between releases stamp PECKLIST_VERSION (scripts/build-version.sh).
def versionProps = new Properties()
file('version.properties').withInputStream { versionProps.load(it) }
def stampedVersion = System.getenv('PECKLIST_VERSION')

// The version code follows from the name, so it grows with every release and an rc sorts before its
// release: MAJOR * 10,000,000 + MINOR * 100,000 + PATCH * 1,000, plus N for -rc.N or 999 for the
// release itself (0.12.0-rc.2 is 1200002, 0.12.0 is 1200999). The same rule is in
// scripts/versions.mjs (androidVersionCode), which checks version.properties against it. Google Play
// refuses a code that is not higher than every one before, so there is no rc.999: it would be the
// release's own.
def versionCodeFor(String name) {
    def match = name =~ /^(0|[1-9]\d*)\.(\d+)\.(\d+)(?:-(.+))?$/
    if (!match) throw new GradleException("not a version: $name")
    def (major, minor, patch) = (1..3).collect { match[0][it] as Integer }
    def pre = match[0][4]
    def rc = pre == null ? 999 : ((pre =~ /^rc\.(\d+)/).with { it ? it[0][1] as Integer : 0 })
    if (minor > 99 || patch > 99 || (pre != null && rc > 998) || major > 213) throw new GradleException("no version code for $name")
    return major * 10000000 + minor * 100000 + patch * 1000 + rc
}

android {
    namespace = "com.pecklist.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.pecklist.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionName stampedVersion ?: versionProps.getProperty('versionName')
        // PECKLIST_VERSION_CODE: the debug APKs' pipeline number, so each installs over the last.
        versionCode((System.getenv('PECKLIST_VERSION_CODE') ?: versionCodeFor(versionName)) as Integer)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            // Also the web build's .gz and .br copies (web/precompress.ts), there for the server to
            // send: Android takes foo.js.gz for a compressed foo.js and fails on the duplicate.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.gz:!*.br'
        }
    }
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storeType 'pkcs12'
                storePassword keystorePassword
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'punchlist'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: keystorePassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseKeystore) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // The commit's hash in the APK: F-Droid's copy must match ours byte for byte.
            vcsInfo.include = false
        }
        debug {
            // A debug build by hand says the repo's version, marked dev.
            if (!stampedVersion) versionNameSuffix = '-dev'
        }
    }
    androidResources {
        // Settings > Apps > PeckList > Language on Android 13 and later lists each language there
        // are strings for (res/values-*), English first (res/resources.properties). PL-148.
        generateLocaleConfig = true
    }
    // Run by test:android. Text meant for people goes in strings.xml, and a translation keeps its
    // string's placeholders and has no string English lacks. A string not translated yet is fine:
    // it shows in English.
    lint {
        error 'HardcodedText', 'ExtraTranslation', 'StringFormatMatches', 'StringFormatInvalid', 'StringFormatCount'
        warning 'MissingTranslation'
        checkOnly 'HardcodedText', 'ExtraTranslation', 'StringFormatMatches', 'StringFormatInvalid', 'StringFormatCount', 'MissingTranslation'
    }
    buildFeatures {
        // BuildConfig.FLAVOR: which build this is (Distribution).
        buildConfig = true
    }
    // Two builds of the same app, with the same app ID and key (docs/development/android.md, Two
    // builds): foss, the GitLab APK and F-Droid's, and play, the Google Play bundle, which leaves out
    // what Play does not allow (src/play/AndroidManifest.xml, Distribution, PaymentLinks).
    flavorDimensions = ['distribution']
    productFlavors {
        foss {
            dimension = 'distribution'
            isDefault = true
        }
        play {
            dimension = 'distribution'
        }
    }
    // A block of dependency metadata encrypted for Google Play: F-Droid refuses it, and nobody else
    // can read it.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.browser:browser:$androidxBrowserVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
