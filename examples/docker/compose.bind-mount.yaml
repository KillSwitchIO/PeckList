# Punchlist with its data in a folder next to this file (./data) instead of a named volume.
#
# The container runs as uid 1654 (the image's non-root "app" user), so the folder must belong to it:
#   mkdir -p data && sudo chown 1654:1654 data
# Or run as your own user (and own ./data yourself) by uncommenting `user:` below.

services:
  punchlist:
    image: registry.gitlab.com/killswitch10/punchlist:latest
    container_name: punchlist
    restart: unless-stopped
    # user: '1000:1000'
    ports:
      - '8080:8080'
    volumes:
      - ./data:/data
    environment:
      TZ: Etc/UTC
