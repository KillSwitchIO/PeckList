# Punchlist with single sign-on through an OpenID Connect provider (Pocket ID here; any works).
# Register this redirect URI with the provider:  https://tasks.example.com/auth/oidc/pocket/callback
# Put the client secret in a file first:  mkdir -p secrets && echo 'the-secret' > secrets/oidc_secret
# Docs: docs/guides/single-sign-on.md

services:
  punchlist:
    image: registry.gitlab.com/killswitch10/punchlist:latest
    container_name: punchlist
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - punchlist-data:/data
      # Attached files, apart from the database.
      - punchlist-files:/files
    environment:
      TZ: Etc/UTC
      PUBLIC_URL: https://tasks.example.com
      OIDC_PROVIDERS: pocket
      OIDC_POCKET_AUTHORITY: https://id.example.com
      OIDC_POCKET_CLIENT_ID: punchlist
      OIDC_POCKET_CLIENT_SECRET_FILE: /run/secrets/oidc_secret
      OIDC_POCKET_DISPLAY_NAME: Pocket ID
      # Only members of this group may sign in; new ones get an account by themselves.
      OIDC_POCKET_REQUIRED_GROUPS: punchlist
      OIDC_POCKET_AUTO_CREATE: 'true'
      # Members of punchlist-admins become admins at every sign-in.
      OIDC_POCKET_ROLE_MAP: punchlist-admins=admin
      # No passwords at all, in the app or the API (punchlist admin login-link gets an admin back in).
      # LOCAL_LOGIN: disabled
    secrets:
      - oidc_secret

secrets:
  oidc_secret:
    file: secrets/oidc_secret

volumes:
  punchlist-data:
  punchlist-files:
