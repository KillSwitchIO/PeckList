# PeckList behind an existing Traefik v3 that watches Docker labels and has a `websecure`
# entrypoint with a certificate resolver called `letsencrypt`. Adjust the names to your setup.
#   docker compose -f compose.traefik.yaml up -d

services:
  pecklist:
    image: registry.gitlab.com/killswitch10/pecklist:latest
    container_name: pecklist
    restart: unless-stopped
    volumes:
      - pecklist-data:/data
      # Attached files, apart from the database.
      - pecklist-files:/files
    environment:
      # Without TZ, apps use the zone of the device they run on, and the server uses UTC.
      # TZ: Europe/Berlin
      PUBLIC_URL: https://tasks.example.com
    networks:
      - proxy
    labels:
      traefik.enable: 'true'
      traefik.http.routers.pecklist.rule: Host(`tasks.example.com`)
      traefik.http.routers.pecklist.entrypoints: websecure
      traefik.http.routers.pecklist.tls.certresolver: letsencrypt
      traefik.http.services.pecklist.loadbalancer.server.port: '8080'

networks:
  # The network Traefik is attached to.
  proxy:
    external: true

volumes:
  pecklist-data:
  pecklist-files:
