# Punchlist behind an existing Traefik v3 that watches Docker labels and has a `websecure`
# entrypoint with a certificate resolver called `letsencrypt`. Adjust the names to your setup.
#   docker compose -f compose.traefik.yaml up -d

services:
  punchlist:
    image: registry.gitlab.com/killswitch10/punchlist:latest
    container_name: punchlist
    restart: unless-stopped
    volumes:
      - punchlist-data:/data
    environment:
      TZ: Etc/UTC
      PUBLIC_URL: https://tasks.example.com
    networks:
      - proxy
    labels:
      traefik.enable: 'true'
      traefik.http.routers.punchlist.rule: Host(`tasks.example.com`)
      traefik.http.routers.punchlist.entrypoints: websecure
      traefik.http.routers.punchlist.tls.certresolver: letsencrypt
      traefik.http.services.punchlist.loadbalancer.server.port: '8080'

networks:
  # The network Traefik is attached to.
  proxy:
    external: true

volumes:
  punchlist-data:
