# A small PostgreSQL for PeckList alone: one pod, its own volume. Fine for a household or a team;
# for more (replicas, point-in-time recovery) use an operator such as CloudNativePG and point the
# pecklist-db Secret's connection string at it instead, leaving this file out.
apiVersion: v1
kind: Service
metadata:
  name: pecklist-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pecklist-postgres
spec:
  serviceName: pecklist-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        # The alpine image's postgres user.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres
          env:
            - name: POSTGRES_USER
              value: pecklist
            - name: POSTGRES_DB
              value: pecklist
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pecklist-db
                  key: password
            # A folder inside the volume: the volume's own root may hold lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, pecklist]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
