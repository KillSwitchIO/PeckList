# PostgreSQL in a small StatefulSet of its own (postgres.yaml). Make the pecklist-db Secret first
# (components/postgres/kustomization.yaml shows how).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pecklist

resources:
  - ../../base
  - postgres.yaml

components:
  - ../../components/postgres

# PostgreSQL moves on its major version by hand: a new major needs a dump and restore.
images:
  - name: postgres
    newTag: 17-alpine
