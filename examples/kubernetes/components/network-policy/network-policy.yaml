apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pecklist
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pecklist
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pecklist-backup
      ports:
        - port: http
