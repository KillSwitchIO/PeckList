apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pecklist
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pecklist
  policyTypes: [Ingress]
  ingress:
    - from:
        # ingress-nginx, in its own namespace.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        # k3s's own Traefik: only its pods, not the rest of kube-system.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pecklist-backup
      ports:
        - port: http
