apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pecklist
spec:
  parentRefs:
    # Your Gateway, with an HTTPS listener for tasks.example.com.
    - name: gateway
      namespace: gateway
  hostnames: [tasks.example.com]
  rules:
    - backendRefs:
        - name: pecklist
          port: 80
      # Live updates (/api/events) are one long-lived request: no request timeout.
      timeouts:
        request: '0s'
