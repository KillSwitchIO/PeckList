apiVersion: apps/v1
kind: Deployment
metadata:
  name: pecklist
spec:
  template:
    spec:
      containers:
        - name: pecklist
          volumeMounts:
            - name: db
              mountPath: /run/secrets/pecklist-db
              readOnly: true
      volumes:
        - name: db
          secret:
            secretName: pecklist-db
            items:
              - key: connection
                path: connection
