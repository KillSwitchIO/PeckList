apiVersion: apps/v1
kind: Deployment
metadata:
  name: pecklist
spec:
  template:
    spec:
      containers:
        - name: pecklist
          volumeMounts:
            - name: oidc
              mountPath: /run/secrets/pecklist-oidc
              readOnly: true
      volumes:
        - name: oidc
          secret:
            secretName: pecklist-oidc
