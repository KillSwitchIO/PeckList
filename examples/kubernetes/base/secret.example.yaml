# An example of the optional `pecklist-secrets` Secret: settings to keep out of the ConfigMap. It is
# not part of any kustomization, so nothing secret sits in your copy of these files. Make it once:
#   kubectl -n pecklist create secret generic pecklist-secrets \
#     --from-literal=ADMIN_PASSWORD='a password of 12 or more characters'
# or fill this in and `kubectl apply -f` it (then keep the file out of version control).
apiVersion: v1
kind: Secret
metadata:
  name: pecklist-secrets
  namespace: pecklist
type: Opaque
stringData:
  # The first admin's password (12+ characters). Without it, the server prints one in its log once:
  #   kubectl -n pecklist logs deploy/pecklist
  ADMIN_PASSWORD: change-me-to-something-long
