apiVersion: apps/v1
kind: Deployment
metadata:
  name: pecklist
spec:
  # One pod, always. SQLite takes one writer, and live updates and the change notifier live inside
  # the process, so a second pod would not see the first one's changes. Recreate stops the old pod
  # before the new one starts, so two never hold the database at once.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  template:
    spec:
      # A Service named `pecklist` would otherwise put PECKLIST_* variables into the pod, which
      # look like settings.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        # The image's own user ("app").
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pecklist
          image: registry.gitlab.com/killswitch10/pecklist
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pecklist-settings
            # Optional: ADMIN_PASSWORD and other secret settings (secret.example.yaml).
            - secretRef:
                name: pecklist-secrets
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: files
              mountPath: /files
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # The first start of a big database migrates it before answering: up to 5 minutes.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          # Alive while it answers on its port. /healthz also checks the database, so a database
          # outage would restart-loop the pod, which cannot help: that stays with readiness.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # The runtime sizes its heap from the memory limit (docs/guides/monitoring.md#memory).
          # 1 GiB is plenty for a household; give a server with many people and tens of thousands
          # of tasks more. No CPU limit: it would only slow the busy moments.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pecklist-data
        - name: files
          persistentVolumeClaim:
            claimName: pecklist-files
        # The root filesystem is read-only; the runtime and uploads in progress (a backup to restore
        # can be hundreds of megabytes) use /tmp.
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
