# Apache httpd 2.4 in front of PeckList on 127.0.0.1:8080.
# Needs: a2enmod proxy proxy_http headers ssl
<VirtualHost *:443>
    ServerName tasks.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/tasks.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tasks.example.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Live updates: an unbuffered, long-lived event stream.
    <Location /api/events>
        ProxyPass http://127.0.0.1:8080/api/events flushpackets=on timeout=3600
        ProxyPassReverse http://127.0.0.1:8080/api/events
    </Location>

    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
