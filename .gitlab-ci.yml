# PeckList CI/CD
#
#   merge requests   check, then what the files can affect: test (web, server, e2e), image build
#                    (amd64, not pushed), docs build, then approval: red until APPROVERS approve
#   main             no test suites: a merge must be up to date, so its tree is the tree its merge
#                    request passed, and verify-tested checks that. Then the :edge image for both
#                    architectures, two devices syncing through it (e2e-server), the test server
#                    updated to it (deploy-test), the docs site (GitLab Pages) and the wiki mirror
#                    of the docs (wiki). FULL_CHECK=true on a run from the UI runs the suites too
#   by hand          android-apk: the Android app's debug APK (merge requests, main);
#                    android-release, web-build, packages (main)
#   release/*        a merge request holding only a release: release-guard, docs and approval
#   a release commit on main, also: its downloads and the signed APK, and the cut-release button
#                    that makes the tag and the release page. prepare-release, on any main pipeline,
#                    opens that commit's merge request
#   tags v1.2.3+...  no re-testing and no build: the release's names on the image main built
#                    (:1.2.3, :1.2, :latest), the docs, the demo
#   schedule         weekly: every test suite on main, the CI images rebuilt, dependency and image
#                    audits
#
# Jobs run on the runner tagged RUNNER_TAG (a self-hosted Docker runner with the host's Docker
# socket, for image builds and the PostgreSQL tests). To use GitLab's shared runners instead, set the
# CI/CD variable RUNNER_TAG=saas-linux-medium-amd64. The jobs that write elsewhere (deploy-test,
# wiki) need GITLAB_API_TOKEN, a token with the api scope, as a masked protected variable; without
# it they do not run. Releasing: docs/development/releasing.md. The pipeline: docs/development/ci.md

stages:
  - check
  - test
  - build
  - publish
  - release
  - approve

variables:
  RUNNER_TAG: homelab
  # Same images as the Dockerfile, so CI builds what the image builds.
  NODE_IMAGE: node:24-bookworm-slim
  DOTNET_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0
  DOCKER_IMAGE: docker:29
  IMAGE: $CI_REGISTRY_IMAGE
  # Images with the tools some jobs need, built from ci/*.Dockerfile by the ci-images job.
  CI_IMAGES: $CI_REGISTRY_IMAGE/ci
  # pnpm and NuGet caches inside the project folder, so GitLab can cache them.
  PNPM_STORE_DIR: $CI_PROJECT_DIR/.pnpm-store
  NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  # Cache and artifact archives: the fastest zip, in parallel. The runner spent more time zipping
  # the 50 000-file pnpm store than installing from it.
  FF_USE_FASTZIP: 'true'
  CACHE_COMPRESSION_LEVEL: fastest
  ARTIFACT_COMPRESSION_LEVEL: fastest

workflow:
  # A newer push to the same branch cancels the pipeline still running for the old one.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open merge request runs as the merge request, not twice.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # Run pipeline from the UI, on any branch.
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  tags:
    - $RUNNER_TAG
  interruptible: true

.on-tag: &on-tag
  if: $CI_COMMIT_TAG

.on-main: &on-main
  if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# A tag re-tests nothing: its commit's main pipeline tested it, and cut-release checks that.
.not-on-tag: &not-on-tag
  if: $CI_COMMIT_TAG
  when: never

# Main does not test the same tree again (verify-tested). The weekly run still does, the safety net
# for a base image that moved or a test that depends on the date.
.not-on-main: &not-on-main
  if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $FULL_CHECK != "true" && $CI_PIPELINE_SOURCE != "schedule"
  when: never

# The commit `pnpm release` made, merged: its one build carries the release's exact version
# (scripts/build-version.sh) and is what a release later names. A weekly run that finds one at main's
# tip is still only the weekly run: it builds no image, so nothing here could have what it needs.
.release-commit: &release-commit
  if: '$CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /^chore\(release\): \d/m'

# A release merge request holds no code (release-guard checks that), so it runs no test suites.
.not-on-release-branch: &not-on-release-branch
  if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release\//
  when: never

# A tag's pipeline names the image main built. Set LEGACY_TAG_BUILD=true to build on the tag instead,
# the way it was done before: the way back until a real release has gone the new way.
.legacy-tag: &legacy-tag
  if: $CI_COMMIT_TAG && $LEGACY_TAG_BUILD == "true"

.new-tag-only: &new-tag-only
  if: $CI_COMMIT_TAG && $LEGACY_TAG_BUILD != "true"

.not-on-schedule: &not-on-schedule
  if: $CI_PIPELINE_SOURCE == "schedule"
  when: never

# A merge request runs the suites its files can affect, and the weekly run on main runs them all.
# A merge request's rule is its job's own changes list and then this, so a job that does not apply is
# left out; other pipelines fall through to the job's last rule. A changes list names only the scripts
# and tool images its job uses (lint runs the script tests on every merge request), and keeps the
# files every job shares: this file, package.json, the lockfile and workspace, mise.toml, .npmrc and
# the schema.
.not-affected: &not-affected
  if: $CI_PIPELINE_SOURCE == "merge_request_event"
  when: never

# The pnpm store, read by every Node job and written back by lint alone (the lockfile is its key,
# so its files only change when the lockfile does, and the runner then skips saving it).
.node:
  image: $NODE_IMAGE
  cache:
    - key:
        files: [pnpm-lock.yaml]
      paths: [.pnpm-store]
      policy: pull
  before_script:
    - corepack enable
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile

.nuget-cache: &nuget-cache
  key:
    files: [server/Directory.Packages.props]
  paths: [.nuget]

# --- check -----------------------------------------------------------------------------------

# The tool images the e2e and Android jobs run in (ci/*.Dockerfile): built when one of their
# inputs changes, and weekly, so base images and Debian packages move on their own. A merge
# request builds and pushes them too, so the jobs after it in the same pipeline use the new ones.
ci-images:
  image: $DOCKER_IMAGE
  stage: check
  needs: []
  timeout: 40m
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      set -eu
      for name in browsers android; do
        echo "=== $CI_IMAGES/$name"
        docker build --pull -f "ci/$name.Dockerfile" -t "$CI_IMAGES/$name:latest" .
        docker push "$CI_IMAGES/$name:latest"
      done
  rules:
    - *not-on-tag
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_IMAGES_BUILD == "true"
    - changes:
        - ci/*.Dockerfile
        - scripts/ci/android-sdk.sh

lint:
  extends: .node
  stage: check
  needs: []
  timeout: 15m
  cache:
    - key:
        files: [pnpm-lock.yaml]
      paths: [.pnpm-store]
      policy: pull-push
    # Apart from the store: these change on every run, and in one archive they made the runner
    # zip the 50 000-file store again each time, 2 to 3 minutes against 80 s of checks.
    - key: lint-tools
      paths: [.eslintcache, .prettiercache]
      policy: pull-push
  script:
    # The three slow checks at once; the quick ones after.
    - node scripts/ci/parallel.mjs
      "pnpm lint --cache --cache-location .eslintcache"
      "pnpm format:check --cache --cache-location .prettiercache"
      "pnpm typecheck"
    - pnpm check:version
    - pnpm check:docs
    - pnpm test:scripts
  rules:
    - *not-on-release-branch
    - *not-on-tag
    - *not-on-main
    - when: on_success

# Whether main's tree is the tree a merge request's pipeline passed (scripts/verify-tested.mjs): what
# lets main skip the test suites, so nothing is built when it fails. To recover, run a pipeline on
# main from the UI with FULL_CHECK=true.
verify-tested:
  image: $NODE_IMAGE
  stage: check
  needs: []
  timeout: 15m
  # A busy runner can spend minutes just on the clone. That is no verdict, and nothing builds until
  # this has one.
  retry:
    max: 2
    when: [server_timeout_running, runner_system_failure, api_failure]
  variables:
    GIT_DEPTH: 1
  script:
    - node scripts/verify-tested.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITLAB_API_TOKEN

# --- test ------------------------------------------------------------------------------------

web-test:
  extends: .node
  stage: test
  needs: []
  timeout: 30m
  # One suite at a time across pipelines: every pipeline shares the one runner, and two or three
  # suites at once (Renovate opens its MRs together) time the jsdom UI tests out.
  resource_group: web-test
  # A retry for the odd timeout that is left (the real fix is tests that wait on what they assert).
  retry:
    max: 1
    when: script_failure
  script:
    # The demo seed runs inside the image build; a change that breaks it should fail here first.
    - node scripts/demo-seed.mts "$CI_PROJECT_DIR/demo-seed.json" --today 2026-01-01
    - pnpm --filter @pecklist/web exec vitest run --coverage
      --reporter=default --reporter=junit --outputFile.junit=junit.xml
      --coverage.reporter=text-summary --coverage.reporter=cobertura
  coverage: '/^Lines\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      junit: web/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: web/coverage/cobertura-coverage.xml
  rules:
    - *not-on-release-branch
    - *not-on-tag
    - *not-on-main
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - web/**/*
        - .gitlab-ci.yml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - mise.toml
        - .npmrc
        - schema/**/*
        - scripts/demo-seed.mts
    - *not-affected
    - when: on_success

server-test:
  image: $DOTNET_IMAGE
  stage: test
  needs: []
  timeout: 30m
  # One suite at a time across pipelines, like web-test: two at once slow each other and fail on load.
  resource_group: server-test
  cache:
    - <<: *nuget-cache
      policy: pull-push
  # The PostgreSQL tests use this service rather than starting a container of their own: a job
  # container reaches a service by name, while a container it starts through the host's Docker sits
  # behind the host's firewall (Testcontainers connects through the bridge gateway).
  services:
    - name: postgres:15-alpine
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres-ci-only
    PECKLIST_TEST_POSTGRES: Host=postgres;Username=postgres;Password=postgres-ci-only;Database=postgres
  script:
    - cd server
    - dotnet test --configuration Release
  rules:
    - *not-on-release-branch
    - *not-on-tag
    - *not-on-main
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - server/**/*
        - .gitlab-ci.yml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - mise.toml
        - .npmrc
        - schema/**/*
    - *not-affected
    - when: on_success

e2e:
  extends: .node
  image: $CI_IMAGES/browsers:latest
  stage: test
  needs:
    - job: ci-images
      optional: true
  timeout: 30m
  # One suite at a time across pipelines, like web-test.
  resource_group: e2e
  retry:
    max: 1
    when: script_failure
  variables:
    E2E_BROWSERS: chrome,firefox
  script:
    - pnpm build
    - pnpm e2e
  artifacts:
    when: on_failure
    paths: [e2e/preview.log, e2e/screenshots]
    expire_in: 7 days
  rules:
    - *not-on-main
    - *not-on-release-branch
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - web/**/*
        - e2e/**/*
        - .gitlab-ci.yml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - mise.toml
        - .npmrc
        - schema/**/*
        - ci/browsers.Dockerfile
    - *not-affected
    - *on-main
    - if: $CI_PIPELINE_SOURCE == "web"

# The docs site (Docusaurus, website/): broken links and #anchors fail the build.
docs:
  extends: .node
  stage: test
  needs: []
  timeout: 15m
  script:
    - pnpm --filter @pecklist/docs build
    - node scripts/check-docs-public.mjs docs website/versioned_docs website/build
  artifacts:
    paths: [website/build]
    expire_in: 1 week
  rules:
    # A release's docs go live with the release, not when its commit merges.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\+/
    - *not-on-tag
    - *not-on-schedule
    # A release merge request's copy of the docs must build too.
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release\//
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docs/**/*
        - website/**/*
        - examples/**/*
        - README.md
        - CONTRIBUTING.md
        - .gitlab-ci.yml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - mise.toml
        - .npmrc
        - schema/**/*
        - scripts/check-docs-public.mjs
    - *not-affected
    - when: on_success

# --- build -----------------------------------------------------------------------------------

# Merge requests build amd64 only, with no attestations, to check that it builds. main pushes :edge
# for amd64 and arm64 with an SBOM and provenance; a tag pushes the release tags the same way.
# Uses the host's Docker through its socket.
container-image:
  image: $DOCKER_IMAGE
  stage: build
  needs:
    - job: verify-tested
      optional: true
    - job: lint
      optional: true
    - job: web-test
      optional: true
    - job: server-test
      optional: true
  timeout: 30m
  variables:
    PLATFORMS: linux/amd64,linux/arm64
    ATTEST: --sbom=true --provenance=mode=min
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker buildx create --name pecklist-ci --driver docker-container --use 2>/dev/null || docker buildx use pecklist-ci
  script:
    - |
      set -eu
      CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      # The tag's version, else the next patch -edge (main) or -dev (other branches).
      VERSION=$(sh scripts/build-version.sh)
      echo "IMAGE_VERSION=$VERSION" > build.env
      # One build per commit: a retry, or a new pipeline on the same commit, finds the image it made.
      # A second build would give the same name a new digest.
      if [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ] \
        && DIGEST=$(docker buildx imagetools inspect "$IMAGE:sha-$CI_COMMIT_SHORT_SHA" --format '{{json .Manifest.Digest}}' 2>/dev/null); then
        echo "$IMAGE:sha-$CI_COMMIT_SHORT_SHA is already built: $DIGEST"
        echo "IMAGE_DIGEST=$(echo "$DIGEST" | tr -d '"')" >> build.env
        exit 0
      fi
      TAGS=""
      PUSH=false
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        TAGS="-t $IMAGE:$VERSION"
        case "$VERSION" in
          *-*) # a pre-release gets its exact tag and its type (rc), never latest
             TYPE=$(echo "$VERSION" | sed -n 's/^[^-]*-\([a-z][a-z]*\).*/\1/p')
             if [ -n "$TYPE" ]; then TAGS="$TAGS -t $IMAGE:$TYPE"; fi ;;
          *) MINOR=$(echo "$VERSION" | cut -d. -f1,2)
             TAGS="$TAGS -t $IMAGE:$MINOR -t $IMAGE:latest" ;;
        esac
        PUSH=true
      elif [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="-t $IMAGE:edge -t $IMAGE:sha-$CI_COMMIT_SHORT_SHA"
        PUSH=true
      else
        TAGS="-t $IMAGE:mr-${CI_MERGE_REQUEST_IID:-0}"
      fi
      CACHE_TO=""
      if [ "$PUSH" = true ]; then CACHE_TO="--cache-to type=registry,ref=$IMAGE:buildcache,mode=min"; fi
      echo "Building $VERSION for $PLATFORMS ($TAGS), push: $PUSH"
      docker buildx build --platform "$PLATFORMS" \
        --build-arg VERSION="$VERSION" --build-arg REVISION="$CI_COMMIT_SHA" --build-arg CREATED="$CREATED" \
        --cache-from type=registry,ref="$IMAGE:buildcache" $CACHE_TO \
        $ATTEST \
        $TAGS --push="$PUSH" .
      if [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then
        DIGEST=$(docker buildx imagetools inspect "$IMAGE:sha-$CI_COMMIT_SHORT_SHA" --format '{{json .Manifest.Digest}}')
        echo "IMAGE_DIGEST=$(echo "$DIGEST" | tr -d '"')" >> build.env
      fi
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - *not-on-schedule
    - *not-on-release-branch
    - *legacy-tag
    - if: $CI_COMMIT_TAG
      when: never
    # On a merge request, only what could break the build itself: main builds the image once anyway,
    # and the code is compiled by the test jobs.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Dockerfile
        - .dockerignore
        - server/**/*.csproj
        - server/Directory.*
        - server/global.json
        - web/package.json
        - e2e/package.json
        - web/src/demo/**/*
        - .gitlab-ci.yml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - mise.toml
        - .npmrc
        - schema/**/*
        - scripts/build-version.sh
        - scripts/demo-seed.mts
      variables:
        PLATFORMS: linux/amd64
        ATTEST: --sbom=false --provenance=false
    - *not-affected
    - <<: *release-commit
      interruptible: false
    - when: on_success

# The telemetry collector's image (PL-116), when its code or the ping it reads changes: built on a
# merge request, pushed from main as :edge and :sha-<commit>. amd64 only; the project runs it.
collector-image:
  image: $DOCKER_IMAGE
  stage: build
  needs:
    - job: server-test
      optional: true
  timeout: 15m
  variables:
    COLLECTOR_IMAGE: $CI_REGISTRY_IMAGE/collector
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      set -eu
      if [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then
        docker build --pull -f server/src/PeckList.Collector/Dockerfile \
          -t "$COLLECTOR_IMAGE:edge" -t "$COLLECTOR_IMAGE:sha-$CI_COMMIT_SHORT_SHA" server
        docker push "$COLLECTOR_IMAGE:edge"
        docker push "$COLLECTOR_IMAGE:sha-$CI_COMMIT_SHORT_SHA"
      else
        docker build --pull -f server/src/PeckList.Collector/Dockerfile -t "$COLLECTOR_IMAGE:mr" server
      fi
  rules:
    - *not-on-tag
    - *not-on-schedule
    - changes:
        - server/src/PeckList.Collector/**/*
        - server/src/PeckList.Core/Telemetry/**/*
        - server/Directory.Packages.props
        - server/global.json

# The web app, by hand on main, for trying the native downloads or the Android app from any commit
# (the image builds its own, inside Docker). Stamped like the image is. A release uses web-dist.
web-build:
  extends: .node
  stage: build
  needs:
    - job: lint
      optional: true
    - job: web-test
      optional: true
  timeout: 15m
  resource_group: heavy-build
  script:
    - export PECKLIST_VERSION="$(sh scripts/build-version.sh)" PECKLIST_REVISION="$CI_COMMIT_SHA"
    - pnpm build
  artifacts:
    paths: [web/dist]
    expire_in: 1 day
  rules:
    - *legacy-tag
    - if: $CI_COMMIT_TAG
      when: never
    # A release commit has web-dist, and the jobs after it must not wait for this button.
    - <<: *release-commit
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# On a release commit: the web app out of the image this commit built, for the native downloads and
# the APK, so all of them carry the one web build the test server ran.
web-dist:
  image: $DOCKER_IMAGE
  stage: build
  needs:
    - job: container-image
      artifacts: true
  timeout: 10m
  interruptible: false
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker pull --quiet "$IMAGE@$IMAGE_DIGEST"
    - CONTAINER=$(docker create "$IMAGE@$IMAGE_DIGEST")
    - mkdir -p web
    - docker cp "$CONTAINER:/app/wwwroot" web/dist
    - docker rm "$CONTAINER"
  artifacts:
    paths: [web/dist]
    expire_in: 1 day
  rules:
    - *release-commit

# The Android app (mobile/, ADR-0017), in the image with the JDK and the SDK (ci/android.Dockerfile).
.android:
  extends: .node
  image: $CI_IMAGES/android:latest
  stage: build
  timeout: 45m
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  cache:
    - key:
        files: [pnpm-lock.yaml]
      paths: [.pnpm-store]
      policy: pull
    - key:
        files: [mobile/android/variables.gradle, mobile/android/build.gradle]
      paths: [.gradle]

# Debug APK, by hand on merge requests and main: for trying a branch on a phone.
android-apk:
  extends: .android
  needs:
    - job: ci-images
      optional: true
  script:
    # The version the image and web app from this commit carry, and a code that only grows.
    - export PECKLIST_VERSION="$(sh scripts/build-version.sh)" PECKLIST_VERSION_CODE="$CI_PIPELINE_IID" PECKLIST_REVISION="$CI_COMMIT_SHA"
    - pnpm --filter @pecklist/mobile apk
    - pnpm --filter @pecklist/mobile test:android
    - cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "pecklist-android-$PECKLIST_VERSION-debug.apk"
  artifacts:
    paths: ['pecklist-android-*-debug.apk']
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true

# Signed release APK: on tags (attached to the release), by hand on main (run web-build first). The
# key comes from the protected variables ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and
# ANDROID_KEY_ALIAS, so only main and v* tags can sign (docs/development/android.md). The version
# code is the pipeline number, which only grows.
android-release:
  extends: .android
  needs:
    - job: web-build
      optional: true
    - job: web-dist
      optional: true
    - job: lint
      optional: true
  resource_group: heavy-build
  script:
    - |
      set -eu
      VERSION=$(sh scripts/build-version.sh)
      export PECKLIST_VERSION="$VERSION" PECKLIST_VERSION_CODE="$CI_PIPELINE_IID" PECKLIST_REVISION="$CI_COMMIT_SHA"
      export ANDROID_KEYSTORE_FILE="$CI_PROJECT_DIR/release-key.p12"
      echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
      # web/dist comes from web-build.
      cd mobile
      pnpm exec cap sync android
      node scripts/gradle.mjs assembleRelease testDebugUnitTest
      cd ..
      APK=mobile/android/app/build/outputs/apk/release/app-release.apk
      "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -E 'DN|SHA-256'
      mkdir -p dist-android
      cp "$APK" "dist-android/pecklist-android-$VERSION.apk"
      echo "Built pecklist-android-$VERSION.apk (code $PECKLIST_VERSION_CODE)"
  after_script:
    - rm -f "$CI_PROJECT_DIR/release-key.p12"
  artifacts:
    paths: [dist-android]
    expire_in: 30 days
  rules:
    - *legacy-tag
    - if: $CI_COMMIT_TAG
      when: never
    - <<: *release-commit
      interruptible: false
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# Native downloads (tags, or by hand from main): self-contained Linux and Windows builds.
packages:
  image: $DOTNET_IMAGE
  stage: build
  needs:
    - job: web-build
      optional: true
    - job: web-dist
      optional: true
    - job: server-test
      optional: true
  timeout: 30m
  resource_group: heavy-build
  cache:
    - <<: *nuget-cache
      policy: pull
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends zip > /dev/null
    - |
      VERSION=$(sh scripts/build-version.sh)
      REVISION=$CI_COMMIT_SHA bash scripts/package.sh "$VERSION"
  artifacts:
    paths: [dist]
    expire_in: 30 days
  rules:
    - *legacy-tag
    - if: $CI_COMMIT_TAG
      when: never
    - <<: *release-commit
      interruptible: false
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# --- publish ---------------------------------------------------------------------------------

# Two devices against the image main just pushed (server-specs): sync, live updates between them.
e2e-server:
  extends: .node
  image: $CI_IMAGES/browsers:latest
  stage: publish
  needs: [container-image]
  timeout: 20m
  retry:
    max: 1
    when: script_failure
  services:
    - name: $IMAGE:sha-$CI_COMMIT_SHORT_SHA
      alias: pecklist
  variables:
    # Services get the job's variables: this is the test server's admin password, nothing real.
    ADMIN_PASSWORD: e2e-admin-password-ci
    # A CI server is not an install: it sends no usage report.
    TELEMETRY: 'false'
    E2E_ADMIN_PASSWORD: e2e-admin-password-ci
    E2E_BASE_URL: http://pecklist:8080
    E2E_BROWSERS: chrome
  script:
    - pnpm e2e:server
  rules:
    - *not-on-schedule
    - <<: *release-commit
      interruptible: false
    - *on-main

# The test server follows main: the compose repository's pin for pecklist-test moves to this image
# by digest and its pipeline releases it (scripts/ci/deploy-test.mjs). Green means the server took
# it. Production never moves from here.
deploy-test:
  image: $NODE_IMAGE
  stage: publish
  needs:
    - e2e-server
    - job: container-image
      artifacts: true
  timeout: 30m
  interruptible: false
  # One at a time, newest first (its process mode is set on the project): a merge right behind this
  # one needs only the last of them on the server.
  resource_group: deploy-test
  script:
    - node scripts/ci/deploy-test.mjs
  environment:
    name: test
    url: $PECKLIST_TEST_ENV_URL
  rules:
    - *not-on-schedule
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITLAB_API_TOKEN

# The docs site, from main.
pages:
  image: busybox
  stage: publish
  needs: [docs]
  script:
    - mv website/build public
  artifacts:
    paths: [public]
  rules:
    - *not-on-schedule
    # A release's docs go live with the release (docs job above).
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /^chore\(release\): \d+\.\d+\.\d+$/m'
      when: never
    - *on-main
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\+/

# The public demo (demo.pecklist.com, PL-117) follows releases: a release tag puts its version there.
deploy-demo:
  image: $NODE_IMAGE
  stage: publish
  needs:
    - job: promote-image
      optional: true
    - job: container-image
      optional: true
  timeout: 30m
  interruptible: false
  variables:
    COMPOSE_SERVICE: pecklist-demo
  script:
    - node scripts/ci/deploy-test.mjs
  environment:
    name: demo
    url: https://demo.pecklist.com
  rules:
    # Releases only, not pre-releases (v1.2.3-rc.1).
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\+/ && $GITLAB_API_TOKEN

# The same docs as wiki pages (scripts/wiki-pages.mjs), for reading inside GitLab.
wiki:
  extends: .node
  image: node:24-bookworm
  stage: publish
  needs: [docs]
  timeout: 10m
  interruptible: false
  script:
    - node scripts/ci/wiki-sync.mjs
  rules:
    - *not-on-schedule
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITLAB_API_TOKEN

# --- weekly audits (the scheduled pipeline) --------------------------------------------------

audit-web:
  extends: .node
  stage: test
  needs: []
  script:
    - pnpm audit --audit-level=high
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

audit-server:
  image: $DOTNET_IMAGE
  stage: test
  needs: []
  cache:
    - <<: *nuget-cache
      policy: pull
  script:
    - cd server
    - dotnet restore
    - dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
    - '! grep -qE "has the following vulnerable packages" vulnerable.txt'
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# The current main image, scanned for known vulnerabilities in what it ships.
audit-image:
  image: $DOCKER_IMAGE
  stage: test
  needs: []
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker pull --quiet "$IMAGE:edge"
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1
      image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:edge"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# --- release ---------------------------------------------------------------------------------

# Prepare a release: make its commit and open its merge request (scripts/ci/prepare-release.mjs). The
# number follows the rule in pnpm release; RELEASE_VERSION names another, such as a pre-release.
prepare-release:
  extends: .node
  image: node:24-bookworm
  stage: release
  needs: [e2e-server]
  timeout: 15m
  interruptible: false
  allow_failure: true
  variables:
    GIT_DEPTH: 0
  script:
    - git config user.name "$GITLAB_USER_NAME"
    - git config user.email "$GITLAB_USER_EMAIL"
    - node scripts/ci/prepare-release.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITLAB_API_TOKEN
      when: manual

# What keeps a release merge request honest, since it runs no test suites (scripts/release-guard.mjs).
release-guard:
  image: node:24-bookworm
  stage: check
  needs: []
  timeout: 5m
  variables:
    GIT_DEPTH: 50
  script:
    - node scripts/release-guard.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release\//

# The downloads of a release commit, ready for the release page.
upload-downloads:
  image: $NODE_IMAGE
  stage: release
  needs: [packages, android-release]
  timeout: 10m
  interruptible: false
  script:
    # The signed APK joins the native downloads and their checksums.
    - cp dist-android/pecklist-android-*.apk dist/pecklist-android.apk
    - (cd dist && sha256sum pecklist-android.apk >> SHA256SUMS)
    - node scripts/ci/upload-downloads.mjs dist
  artifacts:
    paths: [dist/SHA256SUMS]
    expire_in: 90 days
  rules:
    - *release-commit

# The button that publishes a release: its protected tag and whole release page, in one call
# (scripts/ci/cut-release.mjs). Needs nobody's token: it acts as whoever pressed it.
cut-release:
  image: $NODE_IMAGE
  stage: release
  needs:
    - job: container-image
      artifacts: true
    - e2e-server
    - job: upload-downloads
      artifacts: true
  timeout: 5m
  interruptible: false
  allow_failure: true
  script:
    - node scripts/ci/cut-release.mjs
  rules:
    - <<: *release-commit
      when: manual

# A tag's pipeline: the release's names on the digest main built, with no build
# (scripts/ci/promote-image.mjs).
promote-image:
  image: $NODE_IMAGE
  stage: build
  needs: []
  timeout: 5m
  interruptible: false
  script:
    - node scripts/ci/promote-image.mjs
  artifacts:
    reports:
      dotenv: promote.env
  rules:
    - *new-tag-only

# The production button, on a release's tag only and always by hand: compose checks the person, the
# release and the digest again, trials the image on a copy of the live data, and only then touches
# production. The job shows compose's own result. Production is never automatic (releasing.md).
deploy-prod:
  stage: release
  inherit:
    default: false
  needs:
    - job: promote-image
      artifacts: true
  variables:
    RELEASE: pecklist
    IMAGE: $CI_REGISTRY_IMAGE:$IMAGE_VERSION@$IMAGE_DIGEST
    RELEASE_TAG: $CI_COMMIT_TAG
  trigger:
    # From a CI variable, so this public file names no private project.
    project: $PECKLIST_COMPOSE_PROJECT
    branch: main
    strategy: mirror
  environment:
    name: production
    url: $PECKLIST_PROD_ENV_URL
  rules:
    # Releases only, not pre-releases (v1.2.3-rc.1).
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+\+/ && $LEGACY_TAG_BUILD != "true"
      when: manual
      allow_failure: true

# Only for a tag built the old way (LEGACY_TAG_BUILD=true).
release:
  image: $NODE_IMAGE
  stage: release
  needs: [container-image, packages, android-release]
  interruptible: false
  script:
    - node scripts/check-version.mjs
    # The signed APK joins the native downloads and their checksums.
    - cp dist-android/pecklist-android-*.apk dist/pecklist-android.apk
    - (cd dist && sha256sum pecklist-android.apk >> SHA256SUMS)
    - node scripts/ci/publish-release.mjs dist
  rules:
    - *legacy-tag

# --- approve ---------------------------------------------------------------------------------

# A merge request passes only once APPROVERS has approved it (GitLab Free has the Approve button
# but no required approvals). It runs last, so approving while the pipeline is still running is
# enough; approving after it failed needs a retry of this job. scripts/check-approval.mjs
approval:
  image: $NODE_IMAGE
  stage: approve
  timeout: 5m
  variables:
    APPROVERS: hambone0
    BOT_APPROVERS: punchlist-bot
  script:
    - node scripts/check-approval.mjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Approves Renovate's routine merge requests as the bot (scripts/ci/approve-renovate.mjs). On main,
# since its token is protected and must not reach a merge request pipeline. It never holds main up.
approve-renovate:
  image: $NODE_IMAGE
  stage: check
  needs: []
  timeout: 5m
  allow_failure: true
  script:
    - node scripts/ci/approve-renovate.mjs
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITLAB_API_TOKEN
