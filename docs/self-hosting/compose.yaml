# Punchlist with SQLite (the default): one container, data in ./data.
#
# The container runs as uid 1654 (the image's non-root "app" user). A named volume works as is.
# For a bind mount like ./data below, create the folder first and give it to that user:
#   mkdir -p data && sudo chown 1654:1654 data
# or run as your own user instead by setting `user: "1000:1000"` (and owning ./data yourself).

services:
  punchlist:
    image: punchlist:dev
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - ./data:/data
    environment:
      # Your reverse proxy's address, if it is not on a private network.
      # TRUSTED_PROXIES: 203.0.113.7
      TZ: Etc/UTC
    healthcheck:
      test: ['CMD', 'dotnet', 'Punchlist.Server.dll', 'healthcheck']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
